<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morocco, processing nexus: Africa supply lines and buildout, 2025–2050</title>
<meta name="description" content="Interactive atlas of inter-African supply lines with Morocco as the processing nexus, and the infrastructure buildout from 2025 to 2050: water, coffee, trade paperwork, power export, and space, science and forest programs.">
<meta name="theme-color" content="#0A1433">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{
  --ink-0:#0A1433; --ink-1:#101C40; --ink-2:#172656; --ink-3:#24356F; --ink-4:#34488A;
  --sand:#EEE3CB; --sand-2:#BDB6CC; --sand-3:#8F8CAB;
  --water:#2fc7fa; --coffee:#e0574e; --paper:#9382f8; --power:#e3aa0a; --frontier:#53cb7d; --industry:#ec79be; --logistics:#D9CBAE;
  --display:"Reem Kufi", "Segoe UI", system-ui, sans-serif;
  --body:"Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --panel-w:400px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink-0);color:var(--sand);font-family:var(--body);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--sand);text-decoration-color:var(--ink-4);text-underline-offset:3px}
a:hover{text-decoration-color:var(--sand)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sand);outline-offset:2px;border-radius:3px}
path.leaflet-interactive:focus,path.leaflet-interactive:focus-visible{outline:none}
.num{font-variant-numeric:lining-nums tabular-nums}

#app{display:grid;grid-template-columns:var(--panel-w) 1fr;height:100vh;height:100dvh}

/* ---------- panel ---------- */
#panel{background:var(--ink-1);border-right:1px solid var(--ink-3);display:flex;flex-direction:column;min-height:0;z-index:1000}
.brand{padding:22px 24px 14px}
.brand h1{font-family:var(--display);font-weight:600;font-size:27px;line-height:1.12;margin:0;letter-spacing:.005em}
.brand p{margin:8px 0 0;color:var(--sand-2);font-size:15px;line-height:1.4;max-width:34ch}
.tabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--ink-3)}
.tabs button{background:none;border:0;padding:10px 8px 9px;color:var(--sand-3);cursor:pointer;font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--sand);border-bottom-color:var(--sand)}
.tabs button:hover{color:var(--sand)}
.tabpanels{flex:1;overflow-y:auto;min-height:0;scrollbar-color:var(--ink-4) transparent}
.tp{padding:18px 24px 40px}
.tp[hidden]{display:none}
.tp h2{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.25;margin:26px 0 8px}
.tp h2:first-child{margin-top:4px}
.tp p{margin:0 0 12px;max-width:62ch}
.tp ul{margin:0 0 12px;padding-left:18px}
.tp li{margin:0 0 7px}
.muted{color:var(--sand-2)}
.small{font-size:14px;line-height:1.45}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin:16px 0 6px}
.fact b{display:block;font-family:var(--display);font-weight:500;font-size:22px;line-height:1.1;font-variant-numeric:lining-nums}
.fact span{display:block;color:var(--sand-2);font-size:13.5px;line-height:1.35;margin-top:3px}
.go{background:none;border:0;padding:0;color:var(--sand);text-decoration:underline;text-decoration-color:var(--ink-4);text-underline-offset:3px;cursor:pointer;text-align:left}
.go:hover{text-decoration-color:var(--sand)}

/* sequence */
.seq{list-style:none;margin:6px 0 0;padding:0}
.seq>li{display:grid;grid-template-columns:44px 1fr;gap:0 12px;padding:18px 0 20px;border-top:1px solid var(--ink-3)}
.seq>li:first-child{border-top:0;padding-top:4px}
.seq .n{font-family:var(--display);font-size:38px;line-height:1;font-weight:500;color:var(--sand);position:relative;padding-top:2px}
.seq .n::after{content:"";position:absolute;left:0;top:46px;width:3px;height:calc(100% - 40px);border-radius:2px;background:var(--c)}
.seq h3{font-family:var(--display);font-weight:500;font-size:19px;margin:0 0 4px;line-height:1.2}
.seq .role{margin:0 0 10px;color:var(--sand-2)}
.seq h4{font-weight:700;font-size:14.5px;margin:12px 0 4px;color:var(--sand)}
.seq ul{list-style:none;padding:0;margin:0}
.seq li li{position:relative;margin:0 0 5px;padding-left:14px;font-size:14.5px;line-height:1.4}
.seq li li::before{content:"";position:absolute;left:1px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--sand-3)}
.seq .go{display:block}
.seq .yrs{color:var(--sand-3);font-size:13.5px;font-variant-numeric:lining-nums}

/* lines + builds lists */
.grp{margin:20px 0 6px;font-family:var(--display);font-weight:500;font-size:16.5px}
.grp:first-child{margin-top:2px}
.rows{list-style:none;margin:0;padding:0}
.rows li{margin:0}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;width:100%;background:none;border:0;padding:8px 6px;border-radius:6px;text-align:left;cursor:pointer;color:var(--sand)}
.row:hover{background:var(--ink-2)}
.row.on{background:var(--ink-2)}
.row .t{font-size:15px;line-height:1.3}
.row .s{display:block;color:var(--sand-3);font-size:13px;margin-top:2px}
.row .y{color:var(--sand-3);font-size:13px;white-space:nowrap;font-variant-numeric:lining-nums tabular-nums;padding-top:2px}
.key{display:block;height:14px;margin-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink-3);background:none;border-radius:20px;padding:3px 10px 3px 8px;font-size:13.5px;cursor:pointer;color:var(--sand-2)}
.chip[aria-pressed="true"]{border-color:var(--sand-3);color:var(--sand);background:var(--ink-2)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.search{width:100%;background:var(--ink-0);border:1px solid var(--ink-3);border-radius:6px;padding:7px 10px;color:var(--sand);font:inherit;font-size:14.5px;margin:0 0 10px}
.search::placeholder{color:var(--sand-3)}
.glyph{width:18px;height:18px;display:block;margin:1px auto 0}

/* ---------- stage ---------- */
#stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
#mapwrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:var(--ink-0);z-index:0}
.leaflet-container{background:var(--ink-0);font-family:var(--body)}
.tiles-base{filter:brightness(1.25) sepia(1) hue-rotate(188deg) saturate(2.4) brightness(.72) contrast(1.08)}
.tiles-labels{filter:sepia(.5) hue-rotate(185deg) saturate(.8) brightness(.95);opacity:.62}
.leaflet-control-attribution{background:rgba(10,20,51,.78)!important;color:var(--sand-3)!important;font-size:11px!important}
.leaflet-control-attribution a{color:var(--sand-2)!important}
.leaflet-bar a{background:var(--ink-1)!important;color:var(--sand)!important;border-bottom-color:var(--ink-3)!important}
.leaflet-bar{border:1px solid var(--ink-3)!important;box-shadow:none!important}

/* year */
#yearmark{position:absolute;left:22px;bottom:14px;z-index:500;pointer-events:none;text-shadow:0 2px 18px rgba(10,20,51,.9)}
#yearmark .yr{display:block;font-family:var(--display);font-weight:600;font-size:104px;line-height:.86;letter-spacing:-.01em;font-variant-numeric:lining-nums;color:var(--sand)}
#yearmark .yrnote{display:block;margin-top:8px;font-size:15px;color:var(--sand-2)}
#yearmark.compact .yr{font-size:58px}
#yearmark.compact .yrnote{font-size:13px;margin-top:4px}
#events{position:absolute;left:12px;top:12px;z-index:500;width:min(290px,34vw);background:rgba(16,28,64,.86);border:1px solid var(--ink-3);border-radius:10px;padding:10px 12px 8px;backdrop-filter:blur(4px)}
#events h2{font-family:var(--display);font-weight:500;font-size:15px;margin:0 0 4px}
#events ul{list-style:none;margin:0;padding:0;max-height:min(260px,32vh);overflow:auto;scrollbar-color:var(--ink-4) transparent}
#events li{margin:0}
#events button{display:flex;gap:8px;align-items:baseline;background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;color:var(--sand);font-size:14px;line-height:1.3;width:100%}
#events button:hover{color:#fff}
#events .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);transform:translateY(-1px)}
#events .what{color:var(--sand-3);font-size:12.5px;display:block}
#events .empty{color:var(--sand-3);font-size:14px;margin:2px 0 4px}
#events .more{color:var(--sand-3);font-size:12.5px;padding:3px 0 2px 16px}

/* layers */
#layers{position:absolute;top:12px;right:12px;z-index:600;width:236px;background:rgba(16,28,64,.92);border:1px solid var(--ink-3);border-radius:10px;padding:8px 12px 9px;backdrop-filter:blur(4px)}
#layers summary{cursor:pointer;font-family:var(--display);font-weight:500;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center}
#layers summary::-webkit-details-marker{display:none}
#layers summary::after{content:"Hide";font-family:var(--body);font-size:13px;color:var(--sand-3)}
#layers:not([open]) summary::after{content:"Show"}
.lg{margin:8px 0 0;padding:0;list-style:none}
.lg li{margin:0}
.lg label{display:grid;grid-template-columns:14px 34px 1fr;align-items:center;gap:7px;padding:2px 0;font-size:13.5px;cursor:pointer}
.lg input{margin:0;accent-color:var(--sand)}
.lg svg{display:block}
.lg-h{font-size:13px;color:var(--sand-3);margin:10px 0 2px}
.status-key{display:grid;grid-template-columns:18px 1fr;gap:2px 8px;align-items:center;font-size:13px;line-height:1.3;margin:4px 0 0}
.opts label{display:flex;gap:8px;align-items:center;font-size:13px;padding:1px 0;cursor:pointer;color:var(--sand-2)}
.opts input{margin:0;accent-color:var(--sand)}
.pp-open #events,.pp-open #layers{opacity:.18;pointer-events:none;transition:opacity .15s}
.pp-open .leaflet-tooltip{display:none}
#clearSel{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:600;background:var(--ink-1);border:1px solid var(--sand-3);border-radius:20px;padding:4px 14px;font-size:14px;cursor:pointer}
#clearSel[hidden]{display:none}
#panelToggle{display:none}

/* ---------- markers ---------- */
.mkw{background:none;border:0}
.mk{display:block;width:18px;height:18px;position:relative}
.mk::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--ink-0)}
.mk-dia::before{inset:5px;border-radius:1px;transform:rotate(45deg)}
.mk-origin::before{inset:5.5px}
.mk.st-building::before{background:var(--ink-0);border:2px solid var(--c);box-shadow:0 0 0 1.5px var(--ink-0)}
.mk.st-building::after{content:"";position:absolute;inset:7.5px;border-radius:50%;background:var(--c)}
.mk-dia.st-building::after{border-radius:0;transform:rotate(45deg);inset:8px}
.mk.st-future{opacity:.42}
.mk.st-future::before{background:transparent;border:1.5px solid var(--c);box-shadow:none}
.mk.st-shelved::before{background:transparent;border:0;box-shadow:none}
.mk.st-shelved::after{content:"×";position:absolute;inset:0;display:grid;place-items:center;color:var(--sand-3);font-size:17px;line-height:1}
.mk-hub{width:22px;height:22px}
.mk-hub::before{display:none}
.mk-hub svg{position:absolute;inset:0;width:22px;height:22px;overflow:visible}
.mk-hub svg rect{fill:var(--c);stroke:var(--ink-0);stroke-width:1.6}
.mk-hub.st-building svg rect{fill:var(--ink-0);stroke:var(--c);stroke-width:1.8}
.mk-hub.st-future{opacity:.42}
.mk-hub.st-future svg rect{fill:transparent;stroke:var(--c);stroke-width:1.2}
.has-sel .mkw:not(.is-sel){opacity:.28}
.mkw.is-sel .mk{transform:scale(1.35)}
.forest{transition:none}
.has-sel .forest{opacity:.3}

/* ---------- lines ---------- */
.ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ln-flow{animation:flow var(--dur,2.6s) linear infinite}
.ln-flow.m-sea{stroke-dasharray:1 9;--dl:-40}
.ln-flow.m-pipeline{stroke-dasharray:10 6;--dl:-48}
.ln-flow.m-hvdc{stroke-dasharray:14 4 2 4;--dl:-48}
.ln-flow.m-cable{stroke-dasharray:6 5;--dl:-44}
.ln-flow.m-grid{stroke-dasharray:4 4;--dl:-40}
.ln-flow.m-road{stroke-dasharray:8 6;--dl:-42}
.ln-flow.m-rail{stroke-dasharray:2 4 8 4;--dl:-36}
.ln-flow.m-canal{stroke-dasharray:12 5;--dl:-51}
.ln-flow.m-data{stroke-dasharray:.5 6;--dl:-39}
@keyframes flow{to{stroke-dashoffset:var(--dl)}}
.ln.is-building{animation:none;stroke-dasharray:3 6;opacity:.7}
.ln.is-ghost{animation:none;stroke-dasharray:2 7;opacity:.16}
.ln.is-shelved{animation:none;stroke-dasharray:2 6;opacity:.45;stroke:#8F8CAB}
.no-motion .ln-flow{animation:none}
.has-sel .ln:not(.is-sel){opacity:.1}
.has-sel .ln.is-sel{opacity:1}
.ln-hit{stroke:#000;stroke-opacity:0}

/* ---------- popups & tooltips ---------- */
.leaflet-popup-content-wrapper{background:var(--ink-1);color:var(--sand);border:1px solid var(--ink-4);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.leaflet-popup-tip{background:var(--ink-1);border:1px solid var(--ink-4)}
.leaflet-popup-content{margin:14px 16px 12px;font-size:14.5px;line-height:1.45;width:300px!important}
.leaflet-container a.leaflet-popup-close-button{color:var(--sand-3)}
.pp-k{display:flex;align-items:center;gap:7px;color:var(--sand-2);font-size:13px}
.pp-k i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.pp h3{font-family:var(--display);font-weight:500;font-size:17px;line-height:1.25;margin:5px 0 8px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 9px}
.bdg{border:1px solid var(--ink-4);border-radius:12px;padding:1px 8px;font-size:12.5px;color:var(--sand-2)}
.bdg.real{border-color:var(--sand-3);color:var(--sand)}
.pp dl{display:grid;grid-template-columns:78px 1fr;gap:3px 10px;margin:0 0 8px;font-size:13.5px}
.pp dt{color:var(--sand-3)}
.pp dd{margin:0}
.pp p{margin:0 0 7px}
.pp .why{color:var(--sand-2)}
.pp .ws{font-size:13px;color:var(--sand-3);border-top:1px solid var(--ink-3);padding-top:7px;margin-top:8px}
.leaflet-tooltip.tt{background:var(--ink-1);color:var(--sand);border:1px solid var(--ink-4);box-shadow:none;font-family:var(--body);font-size:13.5px;padding:3px 8px;border-radius:6px}
.leaflet-tooltip.tt::before{display:none}

/* ---------- timeline ---------- */
#timeline{background:var(--ink-1);border-top:1px solid var(--ink-3);padding:10px 16px 10px;z-index:700}
.tl{display:grid;grid-template-columns:auto 176px 1fr;gap:0 12px;align-items:start}
#play{grid-row:1 / span 3;align-self:center;background:var(--sand);color:var(--ink-0);border:0;border-radius:22px;padding:7px 16px;font-weight:700;cursor:pointer;min-width:78px}
#play:hover{background:#fff}
.tl-labels{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--sand-2);line-height:13px}
.tl-labels span{height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-labels .sp{height:19px}
.tl-labels .msl{height:16px;line-height:16px;color:var(--sand-3)}
.track{position:relative;min-width:0;margin:0 16px 0 10px}
.bars{display:grid;grid-auto-rows:13px;gap:3px;position:relative}
.bar{position:relative}
.bar i{position:absolute;top:3px;height:7px;border-radius:4px;background:var(--c)}
.bar i.tail{opacity:.28}
.axis{position:relative;height:18px;margin-top:4px;border-top:1px solid var(--ink-3)}
.axis span{position:absolute;top:3px;transform:translateX(-50%);font-size:12px;color:var(--sand-3);font-variant-numeric:lining-nums tabular-nums}
.axis span.tick{top:-1px;width:1px;height:4px;background:var(--ink-4);transform:none}
.today{position:absolute;top:-2px;bottom:18px;width:0;border-left:1px dashed var(--sand-3);pointer-events:none}
.today b{position:absolute;bottom:2px;left:4px;font-weight:400;font-size:12px;color:var(--sand-2);white-space:nowrap}
.cursor{position:absolute;top:-4px;bottom:14px;width:2px;margin-left:-1px;background:var(--sand);border-radius:1px;pointer-events:none;box-shadow:0 0 0 2px var(--ink-1)}
#yr{position:absolute;left:0;top:-4px;width:100%;height:calc(100% - 12px);margin:0;padding:0;opacity:0;cursor:ew-resize}
.track:focus-within .cursor{box-shadow:0 0 0 2px var(--ink-1),0 0 0 4px var(--sand)}
.ms{position:relative;height:16px;margin-top:0}
.ms button{position:absolute;top:2px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--ink-0);border:2px solid var(--sand-2);padding:0;cursor:pointer}
.ms button.sc{border-style:dotted;border-color:var(--sand-3)}
.ms button:hover{background:var(--sand)}

.ind{display:flex;gap:10px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.tile{flex:1 0 196px;min-width:196px;background:var(--ink-0);border:1px solid var(--ink-3);border-radius:8px;padding:6px 10px 6px;display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:end}
.tile .lab{grid-column:1 / -1;font-size:12.5px;color:var(--sand-2);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .val{display:block;font-weight:700;font-size:19px;line-height:1.15;white-space:nowrap;font-variant-numeric:lining-nums tabular-nums}
.tile .val small{font-weight:400;font-size:12.5px;color:var(--sand-2);margin-left:3px}
.tile .prov{display:block;font-size:11.5px;color:var(--sand-3);white-space:nowrap}
.tile svg{width:100%;min-width:60px;height:32px;display:block;cursor:crosshair}

/* ---------- small screens ---------- */
@media (max-width:900px){
  body{overflow:auto}
  #app{display:block;height:auto}
  #stage{height:100vh;height:100dvh}
  #panel{position:fixed;inset:0 auto 0 0;width:min(92vw,420px);transform:translateX(-102%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.5)}
  #panel.open{transform:none}
  #panelToggle{display:block;position:absolute;top:12px;left:12px;z-index:800;background:var(--sand);color:var(--ink-0);border:0;border-radius:20px;padding:6px 14px;font-weight:700;cursor:pointer}
  #panelClose{display:inline-block!important}
  #layers{width:220px;top:56px}
  #yearmark .yr{font-size:72px}
  #events{display:none}
  .tl{grid-template-columns:auto 1fr}
  .tl-labels{display:none}
  .ms,.today b{display:none}
  #panel{z-index:1200}
  .tile{flex-basis:150px;min-width:150px}
}
@media (prefers-reduced-motion:reduce){
  .ln-flow{animation:none}
  #panel{transition:none}
}
#panelClose{display:none;float:right;background:none;border:1px solid var(--ink-3);border-radius:16px;padding:2px 10px;font-size:13px;cursor:pointer;color:var(--sand-2);margin-top:2px}
</style>
</head>
<body>
<noscript><p style="padding:24px">This atlas needs JavaScript to draw the map and timeline.</p></noscript>
<div id="app">
  <aside id="panel" aria-label="Plan">
    <header class="brand">
      <button id="panelClose" type="button">Close</button>
      <h1>Morocco, processing nexus</h1>
      <p>Inter-African supply lines and the infrastructure that carries them, 2025 to 2050</p>
    </header>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="t-arg" aria-controls="p-arg" aria-selected="true">Argument</button>
      <button role="tab" id="t-seq" aria-controls="p-seq" aria-selected="false" tabindex="-1">Sequence</button>
      <button role="tab" id="t-lin" aria-controls="p-lin" aria-selected="false" tabindex="-1">Lines</button>
      <button role="tab" id="t-bld" aria-controls="p-bld" aria-selected="false" tabindex="-1">Builds</button>
      <button role="tab" id="t-not" aria-controls="p-not" aria-selected="false" tabindex="-1">Notes</button>
    </nav>
    <div class="tabpanels">
      <section class="tp" id="p-arg" role="tabpanel" aria-labelledby="t-arg"></section>
      <section class="tp" id="p-seq" role="tabpanel" aria-labelledby="t-seq" hidden></section>
      <section class="tp" id="p-lin" role="tabpanel" aria-labelledby="t-lin" hidden></section>
      <section class="tp" id="p-bld" role="tabpanel" aria-labelledby="t-bld" hidden></section>
      <section class="tp" id="p-not" role="tabpanel" aria-labelledby="t-not" hidden></section>
    </div>
  </aside>

  <main id="stage">
    <div id="mapwrap">

const ARG = `
<h2>The bet</h2>
<p>Africa still ships most of what it grows and mines as raw material. Its largest customer, Europe, is turning proof of origin, carbon and deforestation into a condition of entry. Morocco sits between the two with a set of assets no other African state holds together: the continent’s biggest port, its only grid link to Europe, deep-water berths on both the Mediterranean and the Atlantic, phosphate, and a record of delivering megaprojects close to schedule.</p>
<p>This plan treats Morocco not as a source of commodities but as the place where African inputs are transformed, certified, financed and powered on their way to market, and where European capital and standards are translated back into African supply chains.</p>
<div class="facts">
  <div class="fact"><b>11.1M TEU</b><span>Tanger Med container traffic in 2025, the largest in Africa and the Mediterranean</span></div>
  <div class="fact"><b>1.4 GW</b><span>Morocco–Spain interconnection, Africa’s only operating grid link to Europe</span></div>
  <div class="fact"><b>86.5%</b><span>Share of world coffee exports shipped as green beans, Oct 2025 to May 2026 (ICO)</span></div>
  <div class="fact"><b>~600 m³</b><span>Fresh water per Moroccan per year, below the 1,000 m³ scarcity line</span></div>
</div>

<h2>What the nexus sells</h2>
<ul>
  <li><b>Processing.</b> Transformation a ferry ride from the EU, in industrial zones already built for it: Tanger Med, Kenitra, Jorf Lasfar, and Nador West Med since October 2026.</li>
  <li><b>Paperwork.</b> A trust stack of traceability, conformity, origin, arbitration and settlement. The EU deforestation rules apply to large and medium operators from 30 December 2026 and make geolocated provenance a ticket of entry for coffee and cocoa.</li>
  <li><b>Power.</b> Cheap renewable electricity and the desalinated water it makes possible, sold inward to processors, north to Iberia and beyond, and south to the West African Power Pool.</li>
</ul>

<h2>Lines of delivery</h2>
<p><b>Inbound commodities.</b> East African coffee through Suez; West African coffee and cotton up the Atlantic; DRC copper and cobalt via the Lobito railway; Malian lithium via Dakar and later the Sahel corridor; Nigerian ammonia to Jorf Lasfar.</p>
<p><b>Energy.</b> The Atlantic gas pipeline, Mauritania and Senegal first and Nigeria last; the Dakhla–Casablanca HVDC line; links to Spain, Portugal, France and Germany; a 400 kV line south toward the West African Power Pool.</p>
<p><b>Outbound.</b> Roasted and soluble coffee, battery materials, apparel and green ammonia to Europe; fertilizer, power, desalination kits and services back into Africa.</p>
<p><b>Services.</b> Provenance data, satellite traceability, trade finance and arbitration. They never appear on a manifest, but they are why the cargo routes through Morocco.</p>
<p><button class="go" data-tab="lin">Trace each line on the map</button></p>

<h2>Why this order</h2>
<ul>
  <li><b>Water first.</b> Every other line draws on it: electrolysers, decaf and soluble coffee, data-centre cooling, tree nurseries. At typical seawater reverse-osmosis energy use of 3 to 4 kWh/m³, the 1.7 bn m³ national target is also a 5 to 7 TWh-a-year electricity customer: the home demand that later justifies export-scale power.</li>
  <li><b>Coffee second.</b> A low-capital, high-margin test of the whole model. It can start inside existing free-zone rules, and it exposes the real frictions fast.</li>
  <li><b>Bureaucratic backing third.</b> Fix exactly what the coffee pilot exposes (origin rules, conformity, payments, transit), then apply the same fixes to every other line.</li>
  <li><b>Power and resale fourth.</b> Export-only links fail when they ignore home demand; the UK dropped Xlinks in June 2025. Rabat now asks for two-way flow and domestic benefit, and by the 2030s water and processing give it both.</li>
  <li><b>Space, science and forests last.</b> Cheap to start and slow to mature. Satellites, labs and forests compound on the water, power and paperwork already built.</li>
</ul>

<h2>What could break it</h2>
<ul>
  <li><b>Western Sahara’s legal status.</b> In October 2024 the EU Court of Justice annulled EU–Morocco trade agreements as applied to the territory. An amended agreement with regional origin labels has applied provisionally since October 2025; critics call it legally fragile. Design rule here: EU-bound processing sits north of the territory, and Dakhla serves Africa-facing transit and consolidation until the question settles.</li>
  <li><b>Sahel security.</b> Mali, Niger and Burkina Faso back the Atlantic Initiative, but the land corridor is largely unbuilt and runs through active insurgencies.</li>
  <li><b>Finance.</b> The gas pipeline alone is about US$25bn. Even with a Q4 2026 investment decision, the first sections would carry Mauritanian and Senegalese gas, not Nigerian.</li>
  <li><b>Rival corridors.</b> Algeria’s Trans-Saharan Gas Pipeline; TAZARA against Lobito; Spanish ports against Tanger Med and Nador.</li>
  <li><b>Origin politics.</b> Coffee producers want to roast at home. The model works only as joint ventures with revenue share and origin branding.</li>
  <li><b>The water–energy loop.</b> Desalination’s power bill and brine are real costs, and a wet year like 2026 can sap urgency before the next drought.</li>
</ul>

<h2>Reading the map</h2>
<p class="muted">Circles are real projects. Diamonds are proposals in this plan. Eight-point stars are processing and trust hubs. A ring means under construction; an outline means not yet started. Up to the dashed “Today” line on the timeline, status reflects reporting as of November 2026; after it, completion years are official targets where marked and this plan’s scenario otherwise.</p>
`;

const NOTES = `
<h2>How to use it</h2>
<p>Drag the timeline or press Play to watch the buildout from 2025 to 2050. Click any marker or line for details. The Lines and Builds tabs list everything on the map; selecting an item highlights it and moves the map. Press Escape or “Clear highlight” to reset.</p>
<h2>Status and evidence</h2>
<p>Every item is marked as a real project or as a proposal in this plan. Real items carry their status as reported up to November 2026. Completion years after that are official targets where the item says so, and scenario years otherwise. Volumes on flow lines and the indicator tiles beyond 2026 are this plan’s scenario, not forecasts by the projects’ owners.</p>
<p>Routes are schematic: sea lanes are drawn offshore and land corridors follow real towns, but neither is a navigation track. Several locations are approximate and say so.</p>
<h2>Western Sahara</h2>
<p>Dakhla, Laâyoune, Boujdour and the Guerguerat crossing are in Western Sahara, a territory whose final status is disputed. Morocco administers most of it and considers it part of its territory; the Polisario Front, backed by Algeria, seeks independence, and the UN lists it as a non-self-governing territory. In October 2025 UN Security Council Resolution 2797 called for negotiations taking Morocco’s autonomy proposal as their basis; supporters called it a breakthrough, while critics, including a former UN envoy, said it tilts a process meant to deliver self-determination. Items located in the territory are flagged in their pop-ups. Borders on the basemap come from OpenStreetMap via CARTO.</p>
<h2>Colour and accessibility</h2>
<p>Sector colours were checked for separation under protan and deutan colour-vision deficiency and for normal vision across all pairs. Shape carries status, dash pattern carries transport mode, and every item is also listed in text. Animated flows stop if your system asks for reduced motion, or with the switch in the Layers box.</p>
<h2>Sources</h2>
<ul class="small" id="srcList"></ul>
<p class="small muted">Prepared November 2026. A strategy scenario for discussion, not investment or legal advice.</p>
`;

const byId = {};
const STAR = '<svg viewBox="-11 -11 22 22" aria-hidden="true"><rect x="-6.2" y="-6.2" width="12.4" height="12.4"/><rect x="-6.2" y="-6.2" width="12.4" height="12.4" transform="rotate(45)"/></svg>';

function nodeState(o, y){
  if(o.shelved) return 'shelved';
  if(y < o.y0) return 'future';
  if(o.y1 && y < o.y1) return 'building';
  return 'online';
}
function interp(pts, y){
  if(!pts||!pts.length) return null;
  if(y <= pts[0][0]) return y < pts[0][0] ? 0 : pts[0][1];
  for(let i=1;i<pts.length;i++){ if(y <= pts[i][0]){ const a=pts[i-1], b=pts[i]; return a[1] + (b[1]-a[1])*(y-a[0])/(b[0]-a[0]); } }
  return pts[pts.length-1][1];
}
function makeIcon(n, st){
  const shape = n.hub ? 'hub' : (n.real ? 'dot' : 'dia');
  const cls = 'mk mk-'+shape+' st-'+st+(n.origin?' mk-origin':'');
  const sz = n.hub ? 22 : 18;
  return L.divIcon({className:'mkw'+(state.sel===n.id?' is-sel':''), html:'<span class="'+cls+'" style="--c:'+SECT[n.s].c+'">'+(n.hub?STAR:'')+'</span>', iconSize:[sz,sz], iconAnchor:[sz/2,sz/2], popupAnchor:[0,-9]});
}
function deliverableText(s){ const d=SECT[s].d; return d ? SECT[s].label+', deliverable '+d : SECT[s].label; }
function yearsText(o){
  const y1 = o.y1 || o.y0;
  if(o.shelved) return 'Shelved in '+o.y0;
  if(o.y0===y1 && y1<=2025) return y1===2025 ? 'Existing' : 'In service since '+y1;
  if(y1 <= TODAY) return o.y0+' to '+y1+', now in service';
  if(y1 > o.y0) return o.y0+' to '+y1+(o.y1o ? ' (official date)' : ' (scenario year)');
  return 'From '+o.y0;
}
function stateText(o, st, y){
  if(st==='shelved') return 'Shelved';
  if(st==='future') return 'Not started in '+y;
  if(st==='building') return (o.real ? 'Under development in ' : 'Proposed, building in ')+y;
  return o.real ? (o.y1 > TODAY ? 'Online by '+y+' in this scenario' : 'Operating') : 'Running in '+y+' (proposal)';
}
const WS_NOTE = '<p class="ws">Located in Western Sahara, a territory whose status is disputed. See Notes.</p>';
function nodePopup(n){
  const st = nodeState(n, state.year);
  const area = n.forest ? '<dt>Restored</dt><dd>'+Math.round(interp(n.forest, state.year)).toLocaleString('en')+'k ha in '+state.year+(state.year>TODAY?' (scenario)':'')+'</dd>' : '';
  return '<div class="pp"><div class="pp-k"><i style="--c:'+SECT[n.s].c+'"></i>'+deliverableText(n.s)+'</div>'+
    '<h3>'+n.n+'</h3><div class="badges"><span class="bdg'+(n.real?' real':'')+'">'+(n.real?'Real project':'Proposal in this plan')+'</span><span class="bdg">'+stateText(n,st,state.year)+'</span></div>'+
    '<dl><dt>Timeline</dt><dd>'+yearsText(n)+'</dd>'+(n.cap?'<dt>Scale</dt><dd>'+n.cap+'</dd>':'')+area+'</dl>'+
    (n.now?'<p>'+(n.real?'<span class="muted">As reported: </span>':'')+n.now+'</p>':'')+(n.why?'<p class="why">'+n.why+'</p>':'')+(n.ws?WS_NOTE:'')+'</div>';
}
function linePopup(l){
  const st = nodeState(l, state.year), v = l.vol ? interp(l.vol, state.year) : null;
  const basis = {real:'Real project', mixed:'Real corridor, proposed flow', concept:'Proposal in this plan'}[l.basis];
  return '<div class="pp"><div class="pp-k"><i style="--c:'+SECT[l.s].c+'"></i>'+deliverableText(l.s)+', '+MODES[l.mode].toLowerCase()+'</div>'+
    '<h3>'+l.n+'</h3><div class="badges"><span class="bdg'+(l.basis==='real'?' real':'')+'">'+basis+'</span><span class="bdg">'+stateText({real:l.basis!=='concept', y1:l.y1, y0:l.y0}, st, state.year)+'</span></div>'+
    '<dl><dt>From</dt><dd>'+l.from+'</dd><dt>To</dt><dd>'+l.to+'</dd><dt>Timeline</dt><dd>'+yearsText(l)+'</dd>'+
    (v!=null && v>0 ? '<dt>Volume</dt><dd>'+(v<10? v.toFixed(1): Math.round(v))+' '+l.unit+' in '+state.year+' (scenario)</dd>':'')+'</dl>'+
    '<p class="why">'+l.note+'</p>'+(l.ws?WS_NOTE:'')+'</div>';
}

/* nodes */
NODES.forEach(n=>{
  byId[n.id] = n; n.kind='node';
  n.marker = L.marker(n.ll, {icon:makeIcon(n,'online'), title:n.n, alt:n.n, keyboard:true, riseOnHover:true});
  n.marker.bindPopup(()=>nodePopup(n), {maxWidth:320, autoPanPadding:[40,40]});
  n.marker.bindTooltip(n.n, {className:'tt', direction:'top', offset:[0,-8]});
  n.marker.on('click', ()=>select(n.id, {fly:false, open:false}));
  if(n.forest){
    n.circle = L.circle(n.ll, {radius:1, color:SECT.frontier.c, weight:1, opacity:.6, fillColor:SECT.frontier.c, fillOpacity:.16, interactive:false, className:'forest'});
  }
});

/* lines */
const SMOOTH = {sea:1, pipeline:1, cable:1, hvdc:1, canal:0, grid:0, road:0, rail:0, data:0};
LINES.forEach(l=>{
  byId[l.id] = l; l.kind='line'; l.parts=[]; l.vmax = l.vol ? Math.max.apply(null, l.vol.map(p=>p[1])) : 1;
  const c = SECT[l.s].c, all=[];
  l.paths.forEach(raw=>{
    const pts = SMOOTH[l.mode] ? smooth(raw, 5) : raw;
    pts.forEach(p=>all.push(p));
    const base = (l.basis!=='concept') ? L.polyline(pts, {color:c, weight:4, opacity:l.basis==='real'?.26:.14, interactive:false, className:'ln ln-base'}) : null;
    const flow = L.polyline(pts, {color:c, weight:MODE_W[l.mode], opacity:.95, interactive:false, className:'ln ln-flow m-'+l.mode});
    const hit = L.polyline(pts, {color:'#000', weight:14, opacity:0, className:'ln-hit', bubblingMouseEvents:false});
    hit.bindTooltip(l.n, {className:'tt', sticky:true});
    hit.on('click', e=>{ select(l.id, {fly:false, open:false}); L.popup({maxWidth:320}).setLatLng(e.latlng).setContent(linePopup(l)).openOn(map); });
    l.parts.push({base, flow, hit});
  });
  l.bounds = L.latLngBounds(all);
});

function show(layer, vis){ if(!layer) return; const has = map.hasLayer(layer); if(vis && !has) layer.addTo(map); else if(!vis && has) map.removeLayer(layer); }
function setCls(layer, cls, on){ const el = layer && layer.getElement && layer.getElement(); if(el) el.classList.toggle(cls, !!on); }

function render(){
  const y = state.year;
  document.getElementById('map').classList.toggle('no-motion', !state.motion);
  NODES.forEach(n=>{
    const st = nodeState(n, y);
    let vis = state.on.has(n.s) && (!state.realOnly || n.real);
    if(st==='future' && !state.ghosts) vis = false;
    show(n.marker, vis);
    if(vis && n._st !== st){ n.marker.setIcon(makeIcon(n, st)); n._st = st; }
    if(n.circle){
      const ha = interp(n.forest, y)*1000; // hectares
      const cvis = vis && st!=='future' && ha>0;
      show(n.circle, cvis);
      if(cvis) n.circle.setRadius(Math.sqrt(ha*10000/Math.PI));
    }
  });
  LINES.forEach(l=>{
    const st = nodeState(l, y);
    let vis = state.on.has(l.s) && (!state.realOnly || l.basis!=='concept');
    if(st==='future' && !state.ghosts) vis = false;
    if(st==='shelved' && !state.shelved) vis = false;
    const w = l.vol ? 1.6 + 2.6*(interp(l.vol, y)/l.vmax) : MODE_W[l.mode];
    l.parts.forEach(p=>{
      const hadBase = p.base && map.hasLayer(p.base);
      show(p.base, vis && (st==='online')); show(p.flow, vis); show(p.hit, vis);
      if(p.base && !hadBase && map.hasLayer(p.base)) p.base.bringToBack();
      if(vis){
        p.flow.setStyle({weight: st==='online' ? w : Math.max(1.4, MODE_W[l.mode]*.7)});
        setCls(p.flow,'is-building', st==='building'); setCls(p.flow,'is-ghost', st==='future'); setCls(p.flow,'is-shelved', st==='shelved');
        const sel = state.sel===l.id;
        setCls(p.flow,'is-sel', sel); setCls(p.base,'is-sel', sel);
      }
    });
  });
  updateYearUI(); updateEvents(); updateTiles();
}

/* selection */
function clearSel(){
  if(!state.sel) return;
  const o = byId[state.sel]; state.sel = null;
  document.getElementById('map').classList.remove('has-sel');
  document.getElementById('clearSel').hidden = true;
  if(o && o.kind==='node'){ const el=o.marker.getElement(); if(el) el.classList.remove('is-sel'); }
  if(o && o.kind==='line'){ o.parts.forEach(p=>{ setCls(p.flow,'is-sel',0); setCls(p.base,'is-sel',0); }); }
  document.querySelectorAll('.row.on').forEach(r=>r.classList.remove('on'));
}
function select(id, opt){
  opt = opt || {fly:true, open:true};
  const o = byId[id]; if(!o) return;
  clearSel();
  if(!state.on.has(o.s)){ state.on.add(o.s); syncLegend(); }
  if(state.realOnly && !(o.kind==='node' ? o.real : o.basis!=='concept')){ state.realOnly=false; document.getElementById('optReal').checked=false; }
  if(o.shelved && !state.shelved){ state.shelved=true; document.getElementById('optShelved').checked=true; }
  if(!o.shelved && state.year < o.y0 && !state.ghosts){ setYear(o.y1||o.y0); }
  state.sel = id;
  document.getElementById('map').classList.add('has-sel');
  document.getElementById('clearSel').hidden = false;
  render();
  if(o.kind==='node'){
    const el=o.marker.getElement(); if(el) el.classList.add('is-sel');
    if(opt.fly){ map.flyTo(o.ll, Math.max(map.getZoom(), o.ll[0]>45?5:6), {duration:.8}); }
    if(opt.open){ setTimeout(()=>o.marker.openPopup(), opt.fly?850:0); }
  } else {
    if(opt.fly){ map.flyToBounds(o.bounds, {padding:[60,60], maxZoom:7, duration:.8}); }
    if(opt.open){ const pth = o.paths.reduce((a,b)=>b.length>a.length?b:a); const at = pth[Math.floor(pth.length*0.55)]; setTimeout(()=>{ L.popup({maxWidth:320, autoPanPadding:[40,40]}).setLatLng(at).setContent(linePopup(o)).openOn(map); }, opt.fly?850:0); }
  }
  document.querySelectorAll('.row[data-id="'+id+'"]').forEach(r=>r.classList.add('on'));
  if(window.matchMedia('(max-width:900px)').matches && opt.fly) document.getElementById('panel').classList.remove('open');
}
map.on('click', clearSel);
map.on('popupopen', ()=>document.getElementById('mapwrap').classList.add('pp-open'));
map.on('popupclose', ()=>document.getElementById('mapwrap').classList.remove('pp-open'));
document.getElementById('clearSel').addEventListener('click', ()=>{ clearSel(); map.closePopup(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ clearSel(); map.closePopup(); } });

function lineKey(c, mode, concept){
  const dash = {sea:'1 6', pipeline:'8 4', hvdc:'10 3 2 3', cable:'5 4', grid:'3 3', road:'6 4', rail:'2 3 6 3', canal:'9 4', data:'.5 4'}[mode||'sea'];
  return '<svg width="34" height="10" viewBox="0 0 34 10" aria-hidden="true">'+(concept?'':'<line x1="2" y1="5" x2="32" y2="5" stroke="'+c+'" stroke-opacity=".3" stroke-width="5" stroke-linecap="round"/>')+'<line x1="2" y1="5" x2="32" y2="5" stroke="'+c+'" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="'+dash+'"/></svg>';
}
const SECT_MODE = {water:'canal', coffee:'sea', paper:'data', power:'hvdc', frontier:'data', industry:'sea', logistics:'road'};
function buildLegend(){
  const ul = document.getElementById('lg');
  ul.innerHTML = ORDER.map(s=>'<li><label><input type="checkbox" data-s="'+s+'" checked>'+lineKey(SECT[s].c, SECT_MODE[s])+'<span>'+SECT[s].label+'</span></label></li>').join('');
  ul.addEventListener('change', e=>{ const s=e.target.dataset.s; if(!s) return; if(e.target.checked) state.on.add(s); else state.on.delete(s); render(); });
  const k = document.getElementById('statusKey');
  const g = (shape, st) => '<span class="mk mk-'+shape+' st-'+st+'" style="--c:#EEE3CB;display:inline-block">'+(shape==='hub'?STAR:'')+'</span>';
  k.innerHTML = g('dot','online')+'<span>Real project, operating</span>'+g('dot','building')+'<span>Real project, under development</span>'+g('dia','online')+'<span>Proposal in this plan</span>'+g('hub','online')+'<span>Processing or trust hub</span>'+g('dot','future')+'<span>Not yet started</span>';
}
function syncLegend(){ document.querySelectorAll('#lg input').forEach(i=>{ i.checked = state.on.has(i.dataset.s); }); }
document.getElementById('optGhost').addEventListener('change', e=>{ state.ghosts=e.target.checked; render(); });
document.getElementById('optReal').addEventListener('change', e=>{ state.realOnly=e.target.checked; render(); });
document.getElementById('optShelved').addEventListener('change', e=>{ state.shelved=e.target.checked; render(); });
const optMotion = document.getElementById('optMotion');
optMotion.checked = state.motion;
optMotion.addEventListener('change', e=>{ state.motion=e.target.checked; render(); });

/* =========================================================
   9. Panel
   ========================================================= */
function glyph(o){
  if(o.kind==='line') return '<span class="key">'+lineKey(SECT[o.s].c, o.mode, o.basis==='concept')+'</span>';
  const shape = o.hub ? 'hub' : (o.real ? 'dot' : 'dia');
  return '<span class="mk mk-'+shape+' st-online glyph" style="--c:'+SECT[o.s].c+'">'+(o.hub?STAR:'')+'</span>';
}
function yrLabel(o){ if(o.shelved) return 'shelved'; if(o.y1<=TODAY && o.y0<=TODAY) return o.y0===o.y1 && o.y1<=2025 ? 'existing' : 'since '+o.y1; return (o.y1&&o.y1!==o.y0) ? o.y0+'–'+o.y1 : String(o.y0); }
function row(o, sub){ return '<li><button class="row" data-id="'+o.id+'">'+glyph(o)+'<span class="t">'+o.n+(sub?'<span class="s">'+sub+'</span>':'')+'</span><span class="y">'+yrLabel(o)+'</span></button></li>'; }

function buildPanel(){
  document.getElementById('p-arg').innerHTML = ARG;
  // sequence
  document.getElementById('p-seq').innerHTML = '<p class="muted small">Morocco’s five deliverables, in the order this plan launches them. The coloured bars on the timeline show when each one is the lead priority; real projects in every sector are already moving.</p><ol class="seq">'+
    SEQ.map((d,i)=>'<li style="--c:'+SECT[d.s].c+'"><div class="n num">'+(i+1)+'</div><div><h3>'+d.t+'</h3><div class="yrs">'+d.yrs+'</div><p class="role">'+d.role+'</p>'+
    '<h4>On the ground</h4><ul>'+d.real.map(r=>'<li><button class="go" data-go="'+r[0]+'">'+r[1]+'</button></li>').join('')+'</ul>'+
    '<h4>This plan adds</h4><ul>'+d.adds.map(r=>'<li><button class="go" data-go="'+r[0]+'">'+r[1]+'</button></li>').join('')+'</ul>'+
    '<h4>Signals to watch</h4><p class="small">'+d.kpi+'</p><h4>Main risk</h4><p class="small">'+d.risk+'</p></div></li>').join('')+'</ol>';
  // lines
  const groups = [['Coffee',['coffee']],['Water',['water']],['Bureaucratic backing',['paper']],['Power, gas and resale',['power']],['Space, science, forests',['frontier']],['Minerals and industry',['industry']],['Ports and corridors',['logistics']]];
  document.getElementById('p-lin').innerHTML = '<p class="muted small">Every line of delivery on the map. Thick faint underlay means real infrastructure; dashes alone mean a proposed flow. Dash pattern shows the mode.</p>'+
    groups.map(g=>{ const ls = LINES.filter(l=>g[1].includes(l.s)); return ls.length ? '<div class="grp">'+g[0]+'</div><ul class="rows">'+ls.map(l=>row(l, l.from+' to '+l.to)).join('')+'</ul>' : ''; }).join('');
  // builds
  const bld = document.getElementById('p-bld');
  bld.innerHTML = '<input class="search" id="q" type="search" placeholder="Search builds, places, programs" aria-label="Search builds"><div class="filters" id="bf">'+
    ORDER.map(s=>'<button class="chip" aria-pressed="true" data-s="'+s+'" style="--c:'+SECT[s].c+'"><i></i>'+SECT[s].label+'</button>').join('')+
    '<button class="chip" aria-pressed="false" id="bReal">Real only</button></div><ul class="rows" id="blist"></ul>';
  const f = {on:new Set(ORDER), real:false, q:''};
  function drawB(){
    const q = f.q.trim().toLowerCase();
    const items = NODES.filter(n=>f.on.has(n.s) && (!f.real||n.real) && (!q || (n.n+' '+(n.cap||'')+' '+(n.now||'')+' '+(n.why||'')).toLowerCase().includes(q)))
      .sort((a,b)=>(a.y1||a.y0)-(b.y1||b.y0) || a.n.localeCompare(b.n));
    document.getElementById('blist').innerHTML = items.length ? items.map(n=>row(n, (n.real?'Real':'Proposal')+', '+SECT[n.s].label.toLowerCase())).join('') : '<li class="muted small" style="padding:8px 6px">No builds match. Clear the search or turn a sector back on.</li>';
  }
  bld.addEventListener('click', e=>{
    const c = e.target.closest('.chip'); if(!c) return;
    if(c.id==='bReal'){ f.real=!f.real; c.setAttribute('aria-pressed', f.real); }
    else { const s=c.dataset.s; if(f.on.has(s)) f.on.delete(s); else f.on.add(s); c.setAttribute('aria-pressed', f.on.has(s)); }
    drawB();
  });
  bld.addEventListener('input', e=>{ if(e.target.id==='q'){ f.q=e.target.value; drawB(); } });
  drawB();
  // notes
  document.getElementById('p-not').innerHTML = NOTES;
  document.getElementById('srcList').innerHTML = SOURCES.map(s=>'<li><a href="'+s[1]+'" target="_blank" rel="noopener">'+s[0]+'</a></li>').join('');
}
document.getElementById('panel').addEventListener('click', e=>{
  const r = e.target.closest('[data-id],[data-go]');
  if(r){ select(r.dataset.id || r.dataset.go); return; }
  const t = e.target.closest('[data-tab]'); if(t) openTab(t.dataset.tab);
});
const TABS = ['arg','seq','lin','bld','not'];
function openTab(k){
  TABS.forEach(t=>{ const b=document.getElementById('t-'+t), p=document.getElementById('p-'+t), on=t===k;
    b.setAttribute('aria-selected', on); b.tabIndex = on?0:-1; p.hidden = !on; });
  document.querySelector('.tabpanels').scrollTop = 0;
}
document.querySelector('.tabs').addEventListener('click', e=>{ const b=e.target.closest('[role=tab]'); if(b) openTab(b.id.slice(2)); });
document.querySelector('.tabs').addEventListener('keydown', e=>{
  if(e.key!=='ArrowRight' && e.key!=='ArrowLeft') return;
  const cur = TABS.findIndex(t=>document.getElementById('t-'+t).getAttribute('aria-selected')==='true');
  const nx = TABS[(cur + (e.key==='ArrowRight'?1:TABS.length-1)) % TABS.length];
  openTab(nx); document.getElementById('t-'+nx).focus();
});
document.getElementById('panelToggle').addEventListener('click', ()=>document.getElementById('panel').classList.add('open'));
document.getElementById('panelClose').addEventListener('click', ()=>document.getElementById('panel').classList.remove('open'));

/* =========================================================
   10. Timeline, events, indicator tiles
   ========================================================= */
const pct = y => ((y - Y0) / (Y1 - Y0) * 100);
function buildTimeline(){
  document.getElementById('tlLabels').innerHTML = PHASES.map(p=>'<span>'+p.lab+'</span>').join('')+'<span class="sp"></span><span class="msl">Milestones</span>';
  document.getElementById('bars').innerHTML = PHASES.map(p=>'<div class="bar" style="--c:'+SECT[p.s].c+'" title="'+p.lab+': lead priority '+p.a+'–'+p.b+'"><i style="left:'+pct(p.a)+'%;width:'+(pct(p.b)-pct(p.a))+'%"></i>'+(p.b<Y1?'<i class="tail" style="left:'+pct(p.b)+'%;width:'+(100-pct(p.b))+'%"></i>':'')+'</div>').join('');
  let ax=''; for(let y=Y0;y<=Y1;y++){ ax += '<span class="tick" style="left:'+pct(y)+'%"></span>'; if(y%5===0) ax += '<span style="left:'+pct(y)+'%">'+y+'</span>'; }
  document.getElementById('axis').innerHTML = ax;
  document.getElementById('today').style.left = pct(TODAY + 10/12)+'%';
  document.getElementById('ms').innerHTML = MILESTONES.map(m=>'<button type="button" class="'+(m.real?'':'sc')+'" style="left:'+pct(m.y)+'%" data-y="'+m.y+'" title="'+m.y+': '+m.t.replace(/"/g,'&quot;')+'" aria-label="'+m.y+' milestones: '+m.t.replace(/"/g,'&quot;')+'"></button>').join('');
  document.getElementById('ms').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b){ stop(); setYear(+b.dataset.y); } });
  const yr = document.getElementById('yr');
  yr.addEventListener('input', ()=>{ stop(); setYear(+yr.value); });
}
function setYear(y){ state.year = Math.max(Y0, Math.min(Y1, Math.round(y))); document.getElementById('yr').value = state.year; render(); }
function updateYearUI(){
  const y = state.year;
  document.getElementById('yearBig').textContent = y;
  document.getElementById('yearNote').textContent = y < TODAY ? 'Reported status' : (y===TODAY ? 'Reported status, November 2026' : 'Scenario year: official targets plus this plan');
  document.getElementById('cursor').style.left = pct(y)+'%';
  document.getElementById('yr').setAttribute('aria-valuetext', y + (y>TODAY?' (scenario)':''));
}
function updateEvents(){
  const y = state.year, items=[];
  [...NODES, ...LINES].forEach(o=>{
    if(!state.on.has(o.s) || (state.realOnly && !(o.kind==='node'?o.real:o.basis!=='concept'))) return;
    if(o.shelved){ if(o.y0===y && state.shelved) items.push({o, w:'Shelved'}); return; }
    if(o.y1===y && o.y1>=2025) items.push({o, w: o.y1===o.y0 ? (y<=TODAY?'In service':'Starts') : 'Comes online'});
    else if(o.y0===y && o.y1!==o.y0) items.push({o, w:'Work starts'});
  });
  const ms = MILESTONES.filter(m=>m.y===y);
  const box = document.getElementById('events');
  const shown = items.filter(i=>!(i.o.y0===i.o.y1 && i.o.y0<=2025));
  const more = shown.length > 6 ? '<li class="more">and '+(shown.length-6)+' more in the Builds and Lines tabs</li>' : '';
  const lis = shown.slice(0,6).map(i=>'<li><button data-id="'+i.o.id+'"><span class="dot" style="--c:'+SECT[i.o.s].c+'"></span><span>'+i.o.n+'<span class="what">'+i.w+(i.o.kind==='node'?(i.o.real?'':', proposal'):(i.o.basis==='concept'?', proposal':''))+'</span></span></button></li>').join('');
  box.innerHTML = '<h2>In '+y+'</h2>'+(ms.length?'<p class="small muted" style="margin:0 0 6px">'+ms.map(m=>m.t).join('; ')+'</p>':'')+
    (lis ? '<ul>'+lis+more+'</ul>' : '<p class="empty">Nothing new comes online this year. Drag the timeline to another year.</p>');
}
document.getElementById('events').addEventListener('click', e=>{ const b=e.target.closest('[data-id]'); if(b) select(b.dataset.id); });

function buildTiles(){
  const wrap = document.getElementById('ind');
  wrap.innerHTML = METRICS.map(m=>'<div class="tile" data-m="'+m.id+'" title="Hover to read a year, click to jump to it"><span class="lab">'+m.lab+'</span><span><span class="val num" id="v-'+m.id+'"></span><span class="prov" id="pv-'+m.id+'"></span></span><svg id="s-'+m.id+'" viewBox="0 0 96 30" preserveAspectRatio="none" aria-hidden="true"></svg></div>').join('');
  METRICS.forEach(m=>{
    const vmax = Math.max.apply(null, m.pts.map(p=>p[1]))*1.05 || 1;
    const X = y => 2 + (y-Y0)/(Y1-Y0)*92, Yp = v => 27 - v/vmax*24;
    m.X=X; m.Y=Yp;
    let solid='', dashed='';
    for(let y=Y0;y<=Y1;y++){ const pt=X(y).toFixed(2)+','+Yp(interp(m.pts,y)).toFixed(2); if(y<=TODAY) solid += (solid?' L':'M')+pt; if(y>=TODAY) dashed += (dashed?' L':'M')+pt; }
    const c = SECT[m.s].c, svg = document.getElementById('s-'+m.id);
    svg.innerHTML = '<line x1="2" y1="27.5" x2="94" y2="27.5" stroke="#24356F" stroke-width="1"/>'+
      '<path d="'+dashed+'" fill="none" stroke="'+c+'" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="2 2.5" vector-effect="non-scaling-stroke"/>'+
      '<path d="'+solid+'" fill="none" stroke="'+c+'" stroke-width="2" vector-effect="non-scaling-stroke"/>'+
      '<line class="cur" x1="0" y1="2" x2="0" y2="28" stroke="#EEE3CB" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    const tile = wrap.querySelector('[data-m="'+m.id+'"]');
    const yearAt = ev => { const r=svg.getBoundingClientRect(); return Math.round(Y0 + Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))*(Y1-Y0)); };
    svg.addEventListener('mousemove', ev=>{ drawTile(m, yearAt(ev)); });
    svg.addEventListener('mouseleave', ()=>drawTile(m, state.year));
    svg.addEventListener('click', ev=>{ stop(); setYear(yearAt(ev)); });
  });
}
function provOf(m, y){
  const p = m.pts.find(p=>p[0]===y);
  if(p) return {r:'Reported', e:'Estimate', t:'Official target', s:'Scenario'}[p[2]];
  return y<=TODAY ? 'Interpolated' : 'Scenario';
}
function drawTile(m, y){
  const v = interp(m.pts, y);
  document.getElementById('v-'+m.id).innerHTML = m.fmt(v)+'<small>'+m.unit+'</small>';
  document.getElementById('pv-'+m.id).textContent = (y===state.year ? '' : y+': ')+provOf(m,y);
  const cur = document.querySelector('#s-'+m.id+' .cur'); const x = m.X(y);
  cur.setAttribute('x1', x); cur.setAttribute('x2', x);
}
function updateTiles(){ METRICS.forEach(m=>drawTile(m, state.year)); }

/* play */
let timer = null;
const playBtn = document.getElementById('play');
function stop(){ if(timer){ clearInterval(timer); timer=null; } playBtn.textContent='Play'; playBtn.setAttribute('aria-label','Play the buildout from 2025 to 2050'); }
playBtn.addEventListener('click', ()=>{
  if(timer){ stop(); return; }
  if(state.year >= Y1) setYear(Y0);
  playBtn.textContent='Pause'; playBtn.setAttribute('aria-label','Pause');
  timer = setInterval(()=>{ if(state.year >= Y1){ stop(); return; } setYear(state.year+1); }, 900);
});
playBtn.setAttribute('aria-label','Play the buildout from 2025 to 2050');

/* init */
if(window.matchMedia('(max-width:900px)').matches) document.getElementById('layers').removeAttribute('open');
buildLegend(); buildPanel(); buildTimeline(); buildTiles(); render();
window.addEventListener('resize', ()=>map.invalidateSize());
function compactYear(){ document.getElementById('yearmark').classList.toggle('compact', map.getZoom() >= 5 || document.getElementById('map').clientWidth < 700); }
map.on('zoomend', compactYear); compactYear();
})();
</script>
</body>
